name: iOS Unsigned Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark this GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-ios:
    name: Build unsigned IPA (experimental)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: "3.41.4"
      PUB_HOSTED_URL: "https://pub.dev"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: ./.github/scripts/release-metadata.ps1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Generate only the missing platform in a temporary project so that
      # flutter create cannot replace the app's sources or dependency files.
      - name: Generate iOS project
        run: |
          set -euo pipefail
          flutter create \
            --platforms=ios \
            --project-name=easycopy \
            --org=com.huangusaki \
            --no-pub \
            "$RUNNER_TEMP/easycopy-ios"
          cp -R "$RUNNER_TEMP/easycopy-ios/ios" ios

      - name: Configure app identity and icons
        run: |
          python3 - <<'PY'
          import json
          import plistlib
          import subprocess
          from pathlib import Path

          info_path = Path("ios/Runner/Info.plist")
          with info_path.open("rb") as file:
              info = plistlib.load(file)
          info["CFBundleDisplayName"] = "EasyCopy"
          info["CFBundleName"] = "EasyCopy"
          info["NSPhotoLibraryUsageDescription"] = "选择图片作为应用壁纸"
          with info_path.open("wb") as file:
              plistlib.dump(info, file, sort_keys=False)

          icons = Path("ios/Runner/Assets.xcassets/AppIcon.appiconset")
          catalog = json.loads((icons / "Contents.json").read_text(encoding="utf-8"))
          for entry in catalog["images"]:
              size = round(float(entry["size"].split("x")[0]) * float(entry["scale"].rstrip("x")))
              subprocess.run([
                  "sips", "-z", str(size), str(size),
                  "assets/icons/app_icon_ios_1024.png",
                  "--out", str(icons / entry["filename"]),
              ], check=True, stdout=subprocess.DEVNULL)

          PY

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      # Flutter's IPA export requires signing. Package the unsigned device
      # bundle directly; it still needs signing before installation on iOS.
      - name: Package unsigned IPA
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p build/ios/unsigned/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qry "$GITHUB_WORKSPACE/dist/EasyCopy-${APP_VERSION}-ios-arm64.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: EasyCopy-${{ steps.meta.outputs.release_tag }}-ios-release
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.meta.outputs.release_notes_path }}
          generate_release_notes: ${{ steps.meta.outputs.release_notes_path == '' }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: dist/*.ipa
          fail_on_unmatched_files: true

      - name: Write build summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### iOS 未签名构建（实验性）
          - IPA 已上传到对应版本的 **GitHub Release**，同时保留本次运行的 **Artifacts**（14 天）。
          - 产物未经签名，普通 iPhone / iPad 需自行签名后才能安装，不能直接用于 App Store / TestFlight。
          - 未做 iOS 功能测试；构建成功仅代表编译通过。
          EOF
